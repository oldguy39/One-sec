name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the app
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Publish APK as a download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OneSecondOff.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest OneSecondOff.apk --title "One Second Off" --notes "Tap OneSecondOff.apk to install."
